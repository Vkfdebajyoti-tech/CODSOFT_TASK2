<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Online Quiz Platform</h1>
        
        <div class="nav-buttons">
            <button onclick="showSection('take-quiz')">Take Quiz</button>
            <button onclick="showSection('create-quiz')">Create Quiz</button>
        </div>

        <div id="take-quiz" class="section">
            <h2>Take a Quiz</h2>
            <div id="quiz-container">
                <div id="question-text" class="question"></div>
                <div id="options-container" class="options"></div>
            </div>
            <div id="result-container" class="hidden">
                <h3>Quiz Completed!</h3>
                <p id="score-text"></p>
                <button onclick="restartQuiz()">Restart Quiz</button>
            </div>
        </div>

        <div id="create-quiz" class="section hidden">
            <h2>Create Your Own Question</h2>
            <form id="quiz-form" onsubmit="addCustomQuestion(event)">
                <input type="text" id="new-q" placeholder="Enter Question" required>
                <input type="text" id="opt1" placeholder="Option 1" required>
                <input type="text" id="opt2" placeholder="Option 2" required>
                <input type="text" id="opt3" placeholder="Option 3" required>
                <input type="text" id="opt4" placeholder="Option 4" required>
                <select id="correct-opt" required>
                    <option value="">Select Correct Option Number</option>
                    <option value="0">Option 1</option>
                    <option value="1">Option 2</option>
                    <option value="2">Option 3</option>
                    <option value="3">Option 4</option>
                </select>
                <button type="submit">Add Question</button>
            </form>
            <p id="msg" style="color: green; margin-top: 10px;"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
