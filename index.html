<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Online Quiz Platform</h1>

        <!-- Auth Section -->
        <div id="auth-section" class="section">
            <h2 id="auth-title">Login to Continue</h2>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <input type="text" id="username" placeholder="Enter Username" required>
                <input type="password" id="password" placeholder="Enter Password" required>
                <button type="submit" id="auth-btn">Login</button>
            </form>
            <p class="toggle-text">
                <span id="auth-toggle-msg">Don't have an account?</span> 
                <a href="#" onclick="toggleAuthMode()">Register here</a>
            </p>
        </div>

        <!-- Main App -->
        <div id="main-app" class="section hidden">
            <div class="user-header">
                <span>Welcome, <b id="user-display"></b>!</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <div class="nav-buttons">
                <button onclick="showSection('quiz-list-section')">Browse Quizzes</button>
                <button onclick="showSection('create-quiz')">Create Quiz</button>
            </div>

            <div id="quiz-list-section" class="sub-section">
                <h2>Available Quizzes</h2>
                <div id="quiz-list" class="quiz-grid"></div>
            </div>

            <div id="take-quiz" class="sub-section hidden">
                <h2 id="current-quiz-title">Taking Quiz</h2>
                <div id="quiz-container">
                    <div id="question-text" class="question"></div>
                    <div id="options-container" class="options"></div>
                </div>
                <div id="result-container" class="hidden">
                    <h3>Quiz Completed!</h3>
                    <p id="score-text"></p>
                    <div id="review-container"></div>
                    <button onclick="showSection('quiz-list-section')">Back to Quizzes</button>
                </div>
            </div>

            <div id="create-quiz" class="sub-section hidden">
                <h2>Create a New Question</h2>
                <form id="quiz-form" onsubmit="addCustomQuestion(event)">
                    <input type="text" id="quiz-category" placeholder="Quiz Category/Title (e.g., Web Tech)" required>
                    <input type="text" id="new-q" placeholder="Enter Question" required>
                    <input type="text" id="opt1" placeholder="Option 1" required>
                    <input type="text" id="opt2" placeholder="Option 2" required>
                    <input type="text" id="opt3" placeholder="Option 3" required>
                    <input type="text" id="opt4" placeholder="Option 4" required>
                    <select id="correct-opt" required>
                        <option value="">Select Correct Option Number</option>
                        <option value="0">Option 1</option>
                        <option value="1">Option 2</option>
                        <option value="2">Option 3</option>
                        <option value="3">Option 4</option>
                    </select>
                    <button type="submit">Add Question</button>
                </form>
                <p id="msg" style="color: green; margin-top: 10px;"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
